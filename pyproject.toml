[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sliding-episodic-recall-engine"
version = "0.1.0"
description = "Bi-directional associative episodic recall buffer organizing historical user interactions into hierarchical context summaries"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-sliding-episodic-recall-engine = "agent_sliding_episodic_recall_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_sliding_episodic_recall_engine*"]
